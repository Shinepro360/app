<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12254a">
<title>ShinePro360 Gym Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Teko:wght@500;600&display=swap">
<style>
/* Layout: navy brand band with four role tabs, then a calm two-column working area. Boldness lives in the live gate QR and the red unpaid banner; the rest stays quiet. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e9edf5; --fg:#0e1a33; --muted:#566280;
  --line:#d9deea; --line-strong:#a9b3c9;
  --head-bg:#12254a; --head-fg:#ffffff;
  --btn-bg:#12254a; --btn-fg:#ffffff;
  --gold-btn:#d9a441; --gold-on:#2a1c02; --gold-ink:#8a5f0e;
  --ok:#14633d; --ok-bg:#d9f1e3; --warn:#805006; --warn-bg:#fbebc8; --bad:#a31d1d; --bad-bg:#fbdcdc;
  --plan:#dbe4f5; --f-body:'Mukta','Noto Sans Devanagari',system-ui,sans-serif; --f-disp:'Teko','Mukta','Noto Sans Devanagari',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1428; --surface:#121f3a; --surface-2:#1a294a; --fg:#eef1f8; --muted:#9aa7c2;
  --line:#243250; --line-strong:#41547e; --head-bg:#08101f; --head-fg:#ffffff;
  --btn-bg:#e0b04c; --btn-fg:#1a1200; --gold-btn:#e0b04c; --gold-on:#1a1200; --gold-ink:#e0b04c;
  --ok:#6fdca4; --ok-bg:#12382a; --warn:#f0c060; --warn-bg:#3d2f0c; --bad:#ff8f8f; --bad-bg:#451c1c; --plan:#1f3260; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1428; --surface:#121f3a; --surface-2:#1a294a; --fg:#eef1f8; --muted:#9aa7c2;
  --line:#243250; --line-strong:#41547e; --head-bg:#08101f; --head-fg:#ffffff;
  --btn-bg:#e0b04c; --btn-fg:#1a1200; --gold-btn:#e0b04c; --gold-on:#1a1200; --gold-ink:#e0b04c;
  --ok:#6fdca4; --ok-bg:#12382a; --warn:#f0c060; --warn-bg:#3d2f0c; --bad:#ff8f8f; --bad-bg:#451c1c; --plan:#1f3260; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-disp);font-weight:600;font-size:34px;line-height:1.05;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:600;font-size:26px;line-height:1.1;text-wrap:balance}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)} .sm{font-size:13px} .num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--head-bg);color:var(--head-fg)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--f-disp);font-weight:600;font-size:24px;line-height:1;background:var(--gold-btn);color:var(--gold-on);padding:7px 8px 3px;letter-spacing:.02em}
.brand b{display:block;font-family:var(--f-disp);font-weight:500;font-size:26px;line-height:1;letter-spacing:.02em}
.brand small{display:block;font-size:12px;opacity:.8}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;margin-left:auto}
.nav a{color:inherit;text-decoration:none;padding:10px 14px 9px;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.nav a[aria-current="page"]{border-bottom-color:var(--gold-btn)}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.45);border-radius:6px;overflow:hidden}.lang button{font:inherit;font-size:13px;font-weight:700;background:transparent;color:inherit;border:0;padding:5px 12px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--gold-btn);color:var(--gold-on)}
.demo{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.demoin{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;padding-block:6px}
main.wrap{padding-block:24px 64px}
a{color:var(--gold-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold-ink);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);padding:8px 16px;border-radius:6px;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--line-strong)}
.btn.gold{background:var(--gold-btn);border-color:var(--gold-btn);color:var(--gold-on)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.lnk{font:inherit;background:none;border:0;padding:0;color:var(--fg);font-weight:700;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
input[type=checkbox]{width:auto;min-height:0}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.frm .full{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sp{justify-content:space-between}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--muted)}
.ohead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}
.sub{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
.sub button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 7px;cursor:pointer;color:var(--muted);white-space:nowrap}
.sub button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--gold-btn)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);background:var(--surface);margin-bottom:24px}
.strip>div{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.strip .big{font-family:var(--f-disp);font-weight:500;font-size:42px;line-height:1.05;font-variant-numeric:tabular-nums}
.strip .big small{font-size:22px;color:var(--muted)}
.strip .lab{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);padding:16px}
.panel>h2,.panel>h3{margin-bottom:10px}
.scan{border:2px solid;padding:14px 16px}
.scan.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .scan.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)} .scan.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.scan-h{display:flex;gap:12px;align-items:flex-start}
.scan-h .mark{font-family:var(--f-disp);font-size:44px;line-height:.9;font-weight:600}
.scan-h b{font-size:19px;display:block;line-height:1.3}
.scan-h p{font-size:14px}
.scan dl{color:var(--fg);margin-top:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:0}
.kv dt{font-size:12px;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:700}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.feed li.bad{background:var(--bad-bg);padding-inline:8px;margin-inline:-8px;color:var(--bad)}
.feed li.bad .muted{color:var(--bad)}
.feed time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.alert{border-left:4px solid var(--line-strong);padding:2px 0 2px 12px;margin-bottom:14px}
.alert.bad{border-color:var(--bad)} .alert.warn{border-color:var(--warn)} .alert.mute{border-color:var(--line-strong)}
.alert ul{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.alert li{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:3px 0}
.tw{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr[data-act]{cursor:pointer} tr.sel td{background:var(--plan)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);border-radius:99px;padding:3px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.prog{height:8px;background:var(--surface-2);margin-top:6px}
.prog i{display:block;height:100%;background:var(--gold-btn)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;max-width:440px}
.cal .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal .d{position:relative;min-height:46px;padding:3px 4px;font-size:13px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.cal .d.in{background:var(--plan);font-weight:700}
.cal .d.past{color:var(--muted);font-weight:400;text-decoration:line-through}
.cal .d.today{outline:2px solid var(--gold-ink);outline-offset:-2px}
.cal .d em{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--gold-ink);line-height:1.1}
.cal .d.xp{background:var(--bad-bg)} .cal .d.xp em{color:var(--bad)}
.dot{position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend .dot{position:static;display:inline-block;margin-right:4px}
.bars{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;align-items:end;height:110px;border-bottom:2px solid var(--line-strong)}
.bars i{display:block;background:var(--line-strong);min-height:2px}
.bars i.now{background:var(--gold-btn)}
.bl{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;font-size:11px;color:var(--muted);margin-top:3px}
.bl span{white-space:nowrap;overflow:visible}
.crowd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.crowd .big{font-family:var(--f-disp);font-weight:500;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.cap{height:10px;background:var(--surface-2);margin:8px 0}
.cap i{display:block;height:100%}
.cap i.ok{background:var(--ok)} .cap i.warn{background:var(--warn)} .cap i.bad{background:var(--bad)}
.gate{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:760px){.gate{grid-template-columns:minmax(0,1fr)}}
.qrbox{background:#fff;border:1px solid var(--line-strong);padding:14px;width:100%;max-width:340px;aspect-ratio:1/1}
.qrbox svg{width:100%;height:100%;display:block}
.cdbar{height:6px;background:var(--surface-2);max-width:340px;margin:10px 0 4px}
.cdbar i{display:block;height:100%;background:var(--gold-btn);transition:width .5s linear}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-all}
.cred{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.cred b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;word-break:break-all}
.err{color:var(--bad);font-weight:600}
.checks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.checks li{padding-left:22px;position:relative}
.checks li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:10px;background:var(--gold-btn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:6px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:20}
details summary{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion:reduce){.cdbar i{transition:none}}
body{margin:0}
.top .btn.alt{color:#fff;border-color:rgba(255,255,255,.45)}
.hact{display:flex;gap:8px;align-items:center;margin-left:auto}
.camov{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.camov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camov .btn{position:relative}
</style>
</head>

const DN={};Object.keys(DICT).forEach(k=>{DN[k.normalize('NFC')]=DICT[k]});
const RE=new RegExp(Object.keys(DN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const tr=s=>s.normalize('NFC').replace(RE,m=>DN[m]).replace(/(^|[^0-9])1 months/g,'$11 month');
const DEV=/[ऀ-ॿ]/;
const ORIG=new WeakMap(),OATT=new WeakMap();
function loc(root){
  if(!root)return;const en=lang==='en';
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){
    const o=ORIG.has(n)?ORIG.get(n):n.data;
    if(!DEV.test(o))continue;
    ORIG.set(n,o);const v=en?tr(o):o;if(n.data!==v)n.data=v;
  }
  const els=Array.from(root.querySelectorAll('[title],[aria-label],[placeholder],a[href^="https://wa.me"]'));
  if(root.nodeType===1)els.push(root);
  els.forEach(el=>{
    const saved=OATT.get(el)||{};
    ['title','aria-label','placeholder'].forEach(a=>{
      if(!el.hasAttribute||!el.hasAttribute(a))return;
      const o=saved[a]!==undefined?saved[a]:el.getAttribute(a);
      if(!DEV.test(o))return;saved[a]=o;el.setAttribute(a,en?tr(o):o);
    });
    if(el.tagName==='A'&&(el.getAttribute('href')||'').indexOf('https://wa.me')===0){
      const o=saved.href!==undefined?saved.href:el.getAttribute('href'),i=o.indexOf('?text=');
      if(i>0){saved.href=o;let t=o.slice(i+6);try{t=decodeURIComponent(t)}catch(e){}el.setAttribute('href',en?o.slice(0,i+6)+encodeURIComponent(tr(t)):o)}
    }
    OATT.set(el,saved);
  });
}

}

function feeInfo(m){
  const days=m.months*30,exp=addD(pd(m.start),days),left=Math.round((exp-T0())/DAY),due=Math.max(0,m.total-m.paid);
  let st='ok',lab='चालू';
  if(left<=0){st='bad';lab='अनपेड: फ़ीस खत्म'}
  else if(left<=5){st='warn';lab=left+' दिन बचे'}
  else if(due>0){st='warn';lab=inr(due)+' बाकी'}
  return{exp:exp,last:addD(exp,-1),left:left,due:due,st:st,lab:lab,days:days};
}
function stats(id){
  const ls=S.logs.filter(l=>l.m===id).sort((a,b)=>a.ts-b.ts);
  const ins=ls.filter(l=>l.t==='in'),outs=ls.filter(l=>l.t==='out');
  const mins=a=>a.map(l=>{const d=new Date(l.ts);return d.getHours()*60+d.getMinutes()});
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const last=ins.length?ins[ins.length-1].ts:null;
  return{avgIn:avg(mins(ins)),avgOut:avg(mins(outs)),last:last,since:last?Math.round((T0()-sod(last))/DAY):null,
    d30:ins.filter(l=>l.ts>=T0().getTime()-29*DAY).length,days:new Set(ins.map(l=>iso(sod(l.ts))))};
}

function drawQR(){
  const box=$('#qr');if(!box)return;
  if(!ui.gTok){box.innerHTML='<p class="muted sm">QR लोड हो रहा है…</p>';loc(box);return}
  if(box.dataset.t===ui.gTok)return;
  box.dataset.t=ui.gTok;
  if(typeof qrcode!=='function'){box.innerHTML='<p class="muted sm">QR लाइब्रेरी लोड नहीं हो सकी। इंटरनेट जाँचें।</p>';loc(box);return}
  const g=gOwn(),txt=appUrl()+'?g='+encodeURIComponent(g?g.code:'')+'&t='+encodeURIComponent(ui.gTok);
  const q=qrcode(0,'M');q.addData(txt);q.make();
  const n=q.getModuleCount();let p='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+='M'+c+' '+r+'h1v1h-1z';
  box.innerHTML='<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" role="img" aria-label="गेट का QR कोड"><path d="'+p+'" fill="#0e1a33"/></svg>';loc(box);
}

function tokenFrom(t){
  t=String(t||'');if(t.indexOf('SP360|')===0)return t;
  try{return new URL(t).searchParams.get('t')||''}catch(e){return ''}
}
let cam=null;
function camStop(){if(!cam)return;clearInterval(cam.timer);try{cam.st.getTracks().forEach(x=>x.stop())}catch(e){}if(cam.ov.parentNode)cam.ov.parentNode.removeChild(cam.ov);cam=null}
async function camScan(){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('इस फ़ोन में QR स्कैनर नहीं है। फ़ोन के कैमरा ऐप से स्कैन करें।');return}
  try{
    const det=new BarcodeDetector({formats:['qr_code']});
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const ov=document.createElement('div');ov.className='camov';
    ov.innerHTML='<video playsinline muted></video><button class="btn gold" type="button" data-act="camclose">कैमरा बंद करें</button>';
    document.body.appendChild(ov);const v=ov.querySelector('video');v.srcObject=st;await v.play();loc(ov);
    let busy=false;
    cam={st:st,ov:ov,timer:setInterval(async()=>{
      if(busy)return;busy=true;
      try{const r=await det.detect(v);if(r[0]){const tok=tokenFrom(r[0].rawValue);if(tok){camStop();await doScan(tok).catch(e=>toast(errH(e.message)))}}}catch(e){}
      busy=false},350)};
  }catch(e){camStop();toast('कैमरा नहीं खुल सका।')}
}

   +'<div><label for="gn">जिम का नाम</label><input id="gn" name="name" required></div><div><label for="go">ओनर का नाम</label><input id="go" name="owner" required></div>'
   +'<div><label for="gph">ओनर का मोबाइल</label><input id="gph" name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div><div><label for="gc">क्षमता (एक समय में कितने लोग)</label><input id="gc" name="cap" type="number" min="5" max="500" value="25" required></div>'
   +'<div class="full"><label for="ga">पता</label><input id="ga" name="address" required></div><div class="full"><button class="btn gold" type="submit">जिम जोड़ें और ID-पासवर्ड बनाएँ</button></div></form></section>'
   +(ng?'<section class="panel" role="status"><h2>'+esc(ng.name)+': लॉगिन तैयार</h2><div class="cred"><span class="muted">जिम ID</span><b>'+esc(ng.code)+'</b><button class="btn alt sm" type="button" data-act="copy" data-t="'+esc(ng.code)+'">कॉपी</button><span class="muted">पासवर्ड</span><b>'+esc(ng.pass)+'</b><button class="btn alt sm" type="button" data-act="copy" data-t="'+esc(ng.pass)+'">कॉपी</button></div>'
   +'<p class="sm muted" style="margin-top:8px">यह पासवर्ड अभी एक ही बार दिखेगा। ओनर को भेज दें।</p>'
   +'<p class="row" style="margin-top:12px"><a class="btn sm" target="_blank" rel="noopener" href="'+wa(ng.phone,'नमस्ते '+ng.owner+', ShinePro360 पर आपके जिम '+ng.name+' का लॉगिन तैयार है। जिम ID: '+ng.code+', पासवर्ड: '+ng.pass+' ऐप लिंक: '+appUrl())+'">WhatsApp से भेजें</a></p></section>':'')
   +'<section><h2 style="margin-bottom:8px">जुड़े हुए जिम</h2><div class="tw"><table><thead><tr><th>ID</th><th>जिम</th><th>ओनर</th><th>पता</th><th>मेंबर</th><th>अभी अंदर</th><th>सेवा</th><th></th></tr></thead><tbody>'
   +(S.gyms.length?S.gyms.map(g=>'<tr><td class="num">'+esc(g.code)+'</td><td><b>'+esc(g.name)+'</b></td><td>'+esc(g.owner)+'<br><span class="muted sm num">'+esc(g.phone)+'</span></td><td>'+esc(g.address)+'</td><td class="num">'+g.count+'</td><td class="num">'+g.inside+'</td><td><span class="pill '+svc(g).c+'">'+svc(g).t+'</span></td><td><div class="row"><button class="btn gold sm" type="button" data-act="paidgym" data-id="'+g.id+'">'+(g.sub==='paid'?'भुगतान हटाएँ':'भुगतान मिला')+'</button><button class="btn alt sm" type="button" data-act="resetpw" data-id="'+g.id+'">नया पासवर्ड</button></div></td></tr>').join(''):'<tr><td colspan="8" class="muted">अभी कोई जिम नहीं जुड़ा।</td></tr>')+'</tbody></table></div></section></div>'
   +'<div class="stack"><section class="panel"><h2>कमाई का हिसाब</h2><label for="fee">हर जिम से मासिक शुल्क (₹)</label><input id="fee" type="number" min="0" data-inp="fee" value="'+esc(ui.fee)+'"><p class="sm muted" style="margin-top:8px">'+paying+' भुगतान वाले जिम × '+inr(fee)+' = <b id="feeTot">'+inr(paying*fee)+'</b> प्रति माह। पहला महीना फ़्री ट्रायल है।</p></section>'
   +'<section class="panel"><h2>डाइट इंक्वायरी</h2><p class="sm muted">ऊपर वाले मेंबर की इंक्वायरी नीचे की तालिका में है।</p></section></div></div>'
   +'<section style="margin-top:28px"><h2 style="margin-bottom:8px">सभी डाइट इंक्वायरी</h2><div class="tw">'+dietRows(S.diets,true)+'</div></section>';
}

/* ---------- actions ---------- */
function toast(t){const e=$('#toast');e.textContent=lang==='en'?tr(t):t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},3200)}
const num=v=>Math.max(0,Math.round(Number(v)||0));
const ACT={
  sub:b=>{ui.sub=b.dataset.v;render()},
  filt:b=>{ui.filt=b.dataset.v;render()},
  selm:b=>{ui.sel=b.dataset.id;const t=new Date();ui.cal={y:t.getFullYear(),m:t.getMonth()};render()},
  openm:b=>{ui.sub='members';ACT.selm(b)},
  calnav:b=>{let m=ui.cal.m+Number(b.dataset.v),y=ui.cal.y;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cal={y:y,m:m};render()},
  lang:b=>setLang(b.dataset.v),
  lmode:b=>{ui.lmode=b.dataset.v;ui.err='';lsSet('sp360-mode',ui.lmode);render()},
  copy:b=>{const t=b.dataset.t;try{navigator.clipboard.writeText(t).then(()=>toast('कॉपी हो गया'),()=>toast(t))}catch(e){toast(t)}},
  closepin:()=>{ui.newPin=null;render()},
  camscan:()=>camScan(),
  camclose:()=>camStop(),
  logout:async()=>{camStop();try{await sb.auth.signOut()}catch(e){}S=BLANK();ui.err='';ui.newPin=null;ui.newGym=null;ui.lastScan=null;ui.dietMsg=null;ui.sel=null;ui.gTok='';ui.gW=null;location.hash='';render()},
  resetpin:async b=>{const m=S.members.find(x=>x.id===b.dataset.id);const r=await fn({action:'reset_member_pin',member_id:m.id});ui.newPin={name:m.name,phone:m.phone,pin:r.pin};render();toast('नया पिन बन गया');const e=$('#pinbox');if(e)e.scrollIntoView()},
  resetpw:async b=>{const g=gym(b.dataset.id);const r=await fn({action:'reset_gym_password',gym_id:g.id});ui.newGym={name:g.name,code:g.code,pass:r.password,owner:g.owner,phone:g.phone};render();toast('नया पासवर्ड बन गया')},
  paidgym:async b=>{const g=gym(b.dataset.id);let v=null;
    if(g.sub!=='paid'){const row=must(await sb.from('gyms').select('paid_until').eq('id',g.id).single());const base=row.paid_until&&pd(row.paid_until)>T0()?pd(row.paid_until):T0();v=iso(addD(base,30))}
    must(await sb.from('gyms').update({paid_until:v}).eq('id',g.id).select());
    await refresh();toast(v?'भुगतान दर्ज हुआ':'भुगतान हटाया')}
};
const CHG={
  assign:async t=>{must(await sb.from('members').update({trainer_id:t.value||null}).eq('id',t.dataset.id).select());await refresh();toast('ट्रेनर अपडेट हुआ')},
  hastr:async t=>{const g=gOwn();must(await sb.rpc('update_my_gym',{p_name:g.name,p_address:g.address,p_capacity:g.capacity,p_has_trainers:t.checked}));await refresh();toast('सेव हो गया')},
  dstat:async t=>{const c=DCODE[DSTAT.indexOf(t.value)];must(await sb.from('diet_inquiries').update({status:c}).eq('id',t.dataset.id).select());await refresh();toast('स्थिति बदली')}
};
async function doLogin(email,pw,bad,keep){
  ui.lv=keep;
  const r=await sb.auth.signInWithPassword({email:email,password:pw});
  if(r.error){ui.err=/invalid|credentials/i.test(r.error.message)?bad:errH(r.error.message);render();return}
  ui.err='';ui.lv={};await enter();
}
const FORMS={
  'login-owner':f=>{const d=new FormData(f);return doLogin(emailOf.owner(d.get('code')),String(d.get('pass')),'जिम ID या पासवर्ड गलत है।',{code:d.get('code')})},
  'login-member':f=>{const d=new FormData(f),code=String(d.get('code')).trim();lsSet('sp360-gym',code);return doLogin(emailOf.member(d.get('phone'),code),String(d.get('pin')),'मोबाइल नंबर या पिन गलत है।',{code:code,phone:d.get('phone')})},
  'login-admin':f=>{const d=new FormData(f);return doLogin(String(d.get('email')).trim(),String(d.get('pass')),'ईमेल या पासवर्ड गलत है।',{email:d.get('email')})},
  addm:async f=>{const d=new FormData(f),mo=Number(d.get('mo')),name=String(d.get('name')).trim(),phone=String(d.get('phone'));
    const r=await fn({action:'create_member',name:name,phone:phone,months:mo,paid:num(d.get('paid'))});
    ui.newPin={name:name,phone:phone,pin:r.pin};ui.sel=r.member_id;await refresh();const e=$('#pinbox');if(e)e.scrollIntoView();toast(name+' जुड़ गए')},
  pay:async f=>{const m=S.members.find(x=>x.id===f.dataset.id),amt=num(new FormData(f).get('amt')),due=Math.max(0,m.total-m.paid);
    if(amt>0&&m.msId){must(await sb.from('payments').insert({gym_id:m.gym,member_id:m.id,membership_id:m.msId,amount:Math.min(amt,due||amt),paid_on:iso(T0())}));await refresh();toast(inr(Math.min(amt,due||amt))+' जमा हुए')}},
  renew:async f=>{const m=S.members.find(x=>x.id===f.dataset.id),d=new FormData(f),mo=Number(d.get('mo')),paid=Math.min(PLAN[mo],num(d.get('paid')));
    const ms=must(await sb.from('memberships').insert({gym_id:m.gym,member_id:m.id,months:mo,total_fee:PLAN[mo],start_date:iso(T0())}).select().single());
    if(paid>0)must(await sb.from('payments').insert({gym_id:m.gym,member_id:m.id,membership_id:ms.id,amount:paid,paid_on:iso(T0())}));
    const t=new Date();ui.cal={y:t.getFullYear(),m:t.getMonth()};await refresh();toast('फ़ीस आज से रिन्यू हो गई')},
  addt:async f=>{const d=new FormData(f);must(await sb.from('trainers').insert({gym_id:S.sess,name:String(d.get('name')).trim(),phone:String(d.get('phone')),speciality:String(d.get('spec')).trim()}));await refresh();toast('ट्रेनर जुड़ गया')},
  diet:async f=>{const d=new FormData(f),m=S.members.find(x=>x.id===f.dataset.id),w=Number(d.get('w')),h=Number(d.get('h')),goal=d.get('goal'),s=dietSuggest(w,h,goal);
    must(await sb.from('diet_inquiries').insert({gym_id:m.gym,member_id:m.id,weight_kg:w,height_cm:Math.round(h),goal:goal,food_pref:d.get('pref'),consent:true}));
    ui.dietMsg='आपका BMI '+s.bmi+' ('+s.cat+') है। सुझाया गया: <b>'+s.type+'</b>। आपकी इंक्वायरी ShinePro360 को भेज दी गई है, हम जल्दी संपर्क करेंगे।';await refresh()},
  addgym:async f=>{const d=new FormData(f),name=String(d.get('name')).trim(),owner=String(d.get('owner')).trim(),phone=String(d.get('phone'));
    const r=await fn({action:'create_gym',name:name,owner_name:owner,owner_phone:phone,address:String(d.get('address')).trim(),capacity:Number(d.get('cap'))||25});
    ui.newGym={name:name,code:r.code,pass:r.password,owner:owner,phone:phone};await refresh();toast('जिम जुड़ गया')}
};
const run=(p,btn)=>Promise.resolve(p).catch(e=>toast(errH(e&&e.message))).then(()=>{if(btn&&btn.isConnected)btn.disabled=false});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=ACT[b.dataset.act];if(a)run(a(b))});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])run(CHG[t.dataset.chg](t))});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;run(FORMS[f.dataset.form](f),btn)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.inp==='q'){ui.q=t.value;const w=$('#mtable');if(w){w.innerHTML=mTable();loc(w)}}
  if(t.dataset.inp==='fee'){ui.fee=t.value;const fee=Number(t.value)||0,e1=$('#feeTot');if(e1)e1.textContent=inr(S.gyms.filter(g=>g.sub==='paid').length*fee)}});

/* ---------- sign-in, routing, render ---------- */
const HOME={admin:'admin',owner:'owner',member:'member'};
const ALLOWED={admin:['admin'],owner:['owner','gate'],member:['member']};
const NAVS={admin:[['admin','ShinePro360 एडमिन']],owner:[['owner','जिम ओनर'],['gate','गेट QR स्क्रीन']],member:[['member','मेंबर ऐप']]};
function routeNow(){
  if(!S.role)return 'login';
  const r=(location.hash||'').slice(1),ok=ALLOWED[S.role]||[];
  return ok.indexOf(r)>=0?r:HOME[S.role];
}
const ROUTES={login:vLogin,owner:vOwner,gate:vGate,member:vMember,admin:vAdmin};
async function enter(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){ui.loading=false;S=BLANK();render();return}
  const au=await sb.from('app_users').select('role,gym_id,member_id').eq('user_id',sess.user.id).maybeSingle();
  if(au.error||!au.data){try{await sb.auth.signOut()}catch(e){}S=BLANK();ui.loading=false;ui.err='आपके खाते को कोई भूमिका नहीं मिली। ShinePro360 से संपर्क करें।';render();return}
  S=BLANK();S.role=au.data.role;S.sess=au.data.gym_id||'';S.me=au.data.member_id||'';
  try{await loadAll()}catch(e){S=BLANK();ui.loading=false;ui.err=errH(e&&e.message);render();return}
  ui.loading=false;ui.sub='today';
  if(location.hash!=='#'+HOME[S.role])history.replaceState(null,'',location.pathname+'#'+HOME[S.role]);
  render();
  if(pending){const t=pending;pending='';if(S.role==='member')await doScan(t).catch(e=>toast(errH(e&&e.message)))}
}
function render(){
  const r=routeNow(),app=$('#app');
  const nav=$('#nav'),lo=$('#lo');
  nav.innerHTML=(NAVS[S.role]||[]).map(n=>'<a href="#'+n[0]+'" aria-current="'+(n[0]===r?'page':'false')+'">'+n[1]+'</a>').join('');
  lo.hidden=!S.role;
  loc($('.top'));
  if(ui.fatal){app.innerHTML='<section class="panel"><p class="err">'+esc(ui.fatal)+'</p></section>';loc(app);return}
  if(ui.loading){app.innerHTML='<p class="muted">लोड हो रहा है…</p>';loc(app);return}
  app.innerHTML=ROUTES[r]();loc(app);
  if(r==='gate')drawQR();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
setInterval(gateTick,500);
setInterval(async()=>{
  if(!S.role||document.hidden||cam)return;
  const a=document.activeElement,r=routeNow();
  if(r!=='gate'&&a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
  try{await loadAll()}catch(e){return}
  if(r==='gate'){const c=$('#gcount');if(c)c.textContent=insideOf(S.sess).length}else render();
},15000);
async function init(){
  locStatic();
  const qs=new URLSearchParams(location.search),t=qs.get('t'),g=qs.get('g');
  if(g){lsSet('sp360-gym',g);ui.lmode='member'}
  if(t){pending=t;ui.lmode='member'}
  if(t||g||location.search)history.replaceState(null,'',location.pathname+location.hash);
  if(!sb){ui.fatal='ऐप लोड नहीं हो सकी। इंटरनेट जाँचकर पेज फिर खोलें।';render();return}
  render();
  try{await enter()}catch(e){ui.loading=false;ui.err=errH(e&&e.message);render()}
}

init();
})();
</script>
