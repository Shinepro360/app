/* Layout: navy brand band with four role tabs, then a calm two-column working area. Boldness lives in the live gate QR and the red unpaid banner; the rest stays quiet. */

  --plan:#dbe4f5; --f-body:'Mukta','Noto Sans Devanagari',system-ui,sans-serif; --f-disp:'Teko','Mukta','Noto Sans Devanagari',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --line:#243250; --line-strong:#41547e; --head-bg:#08101f; --head-fg:#ffffff;
  --btn-bg:#e0b04c; --btn-fg:#1a1200; --gold-btn:#e0b04c; --gold-on:#1a1200; --gold-ink:#e0b04c;
  --ok:#6fdca4; --ok-bg:#12382a; --warn:#f0c060; --warn-bg:#3d2f0c; --bad:#ff8f8f; --bad-bg:#451c1c; --plan:#1f3260; color-scheme:dark}}
:root[data-theme="dark"]{

  --line:#243250; --line-strong:#41547e; --head-bg:#08101f; --head-fg:#ffffff;
  --btn-bg:#e0b04c; --btn-fg:#1a1200; --gold-btn:#e0b04c; --gold-on:#1a1200; --gold-ink:#e0b04c;

.exg button.dn{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.bodybox svg{width:100%;max-width:340px;display:block;margin:0 auto}
.track{margin-top:12px;padding:12px;border:2px solid var(--gold-btn);border-radius:12px;background:var(--warn-bg)}
.setrow{display:flex;align-items:baseline;gap:8px;margin:10px 0}
.setn{font-size:34px}

textarea{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:6px;padding:8px 10px;width:100%;resize:vertical}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rc{font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.rc .ri{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rc .rt{font-weight:700;font-size:14px}
.rc-owner .ri{background:var(--warn-bg);color:var(--warn)}.rc-member .ri{background:var(--ok-bg);color:var(--ok)}.rc-admin .ri{background:var(--info-bg);color:var(--info)}
.rc[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg) inset}
.livebox{border:2px solid var(--gold-btn)!important;background:var(--warn-bg)!important}
.livebox h2{display:flex;align-items:center;gap:8px}
.livedot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:lp 1.4s infinite}
.livetag{font-size:11px;letter-spacing:1px;background:var(--bad);color:#fff;padding:2px 7px;border-radius:99px}
@keyframes lp{50%{opacity:.25}}
.entry.ready{background:var(--info-bg);border-color:var(--info)}
.entry.in{background:var(--ok-bg);border-color:var(--ok)}
.entry.out{background:var(--bad-bg);border-color:var(--bad)}

const ftm=mins=>ft(T0().getTime()+mins*60000);
const hl=h=>((h%24)%12||12)+(h%24<12?' AM':' PM');
const wa=(ph,t)=>'https://wa.me/'+(ph?'91'+String(ph).replace(/\D/g,''):'')+'?text='+encodeURIComponent(t);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const DN={};Object.keys(DICT).forEach(k=>{DN[k.normalize('NFC')]=DICT[k]});
const RE=new RegExp(Object.keys(DN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const tr=s=>s.normalize('NFC').replace(RE,m=>DN[m]).replace(/(^|[^0-9])1 months/g,'$11 month');
const DEV=/[ऀ-ॿ]/;
const ORIG=new WeakMap(),OATT=new WeakMap();
function loc(root){
  if(!root)return;const en=lang==='en';
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){
    const o=ORIG.has(n)?ORIG.get(n):n.data;
    if(!DEV.test(o))continue;
    ORIG.set(n,o);const v=en?tr(o):o;if(n.data!==v)n.data=v;
  }
  const els=Array.from(root.querySelectorAll('[title],[aria-label],[placeholder],a[href^="https://wa.me"]'));
  if(root.nodeType===1)els.push(root);
  els.forEach(el=>{
    const saved=OATT.get(el)||{};
    ['title','aria-label','placeholder'].forEach(a=>{
      if(!el.hasAttribute||!el.hasAttribute(a))return;
      const o=saved[a]!==undefined?saved[a]:el.getAttribute(a);
      if(!DEV.test(o))return;saved[a]=o;el.setAttribute(a,en?tr(o):o);
    });
    if(el.tagName==='A'&&(el.getAttribute('href')||'').indexOf('https://wa.me')===0){
      const o=saved.href!==undefined?saved.href:el.getAttribute('href'),i=o.indexOf('?text=');
      if(i>0){saved.href=o;let t=o.slice(i+6);try{t=decodeURIComponent(t)}catch(e){}el.setAttribute('href',en?o.slice(0,i+6)+encodeURIComponent(tr(t)):o)}
    }
    OATT.set(el,saved);
  });
}

function feeInfo(m){
  const days=m.months*30,exp=addD(pd(m.start),days),left=Math.round((exp-T0())/DAY),due=Math.max(0,m.total-m.paid);
  let st='ok',lab='चालू';

  else if(due>0){st='warn';lab=inr(due)+' बाकी'}

}
function stats(id){
  const ls=S.logs.filter(l=>l.m===id).sort((a,b)=>a.ts-b.ts);
  const ins=ls.filter(l=>l.t==='in'),outs=ls.filter(l=>l.t==='out');
  const mins=a=>a.map(l=>{const d=new Date(l.ts);return d.getHours()*60+d.getMinutes()});
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const last=ins.length?ins[ins.length-1].ts:null;
  return{avgIn:avg(mins(ins)),avgOut:avg(mins(outs)),last:last,since:last?Math.round((T0()-sod(last))/DAY):null,
    d30:ins.filter(l=>l.ts>=T0().getTime()-29*DAY).length,days:new Set(ins.map(l=>iso(sod(l.ts))))};

/* ---------- gate QR (owner screen) ---------- */
function paintQR(box,tk,g){
  if(!tk){box.innerHTML='<p class="muted sm">QR लोड हो रहा है…</p>';loc(box);return}
  if(box.dataset.t===tk)return;
  box.dataset.t=tk;
  if(typeof qrcode!=='function'){box.innerHTML='<p class="muted sm">QR लाइब्रेरी लोड नहीं हो सकी। इंटरनेट जाँचें।</p>';loc(box);return}
  const txt=appUrl()+'?g='+encodeURIComponent(g?g.code:'')+'&t='+encodeURIComponent(tk);
  const q=qrcode(0,'M');q.addData(txt);q.make();
  const n=q.getModuleCount();let p='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+='M'+c+' '+r+'h1v1h-1z';
  box.innerHTML='<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" role="img" aria-label="गेट का QR कोड"><path d="'+p+'" fill="#0e1a33"/></svg>';loc(box);
}
function drawQR(){
  const g=gOwn();if(!g)return;
  const a=$('#qr');if(a)paintQR(a,g.qrMode==='static'?ui.sTok:ui.gTok,g);
  const b=$('#qrs');if(b)paintQR(b,ui.sTok,g);
}
async function gateTick(){
  if(routeNow()!=='gate')return;
  const g0=gOwn();if(!g0)return;
  const mm=g0.qrMode;
  if((mm==='static'||mm==='both')&&!ui.sTok&&!ui.sBusy){ui.sBusy=true;try{ui.sTok=must(await sb.rpc('static_token'))}catch(e){}ui.sBusy=false;drawQR()}
  if(mm==='static')return;
  const now=Date.now()/1000;
  const stale=!ui.gTok||(ui.gW!=null&&now>=(ui.gW+1)*30&&Date.now()-ui.gAt>2500);
  if(stale&&!ui.gBusy){
    ui.gBusy=true;ui.gAt=Date.now();
    try{const t=must(await sb.rpc('gate_token'));ui.gTok=t;ui.gW=Number(String(t).split('|')[2])}catch(e){}
    ui.gBusy=false;drawQR();
  }
  const left=ui.gW==null?30:Math.max(0,Math.ceil((ui.gW+1)*30-now)),c=$('#cd'),b=$('#cdbar');
  if(c)c.textContent=Math.min(30,left);if(b)b.style.width=(Math.min(30,left)/30*100)+'%';
}

let pending='';
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);let best=null,id=null,done=false;
  const fin=()=>{if(done)return;done=true;try{navigator.geolocation.clearWatch(id)}catch(e){}clearTimeout(tm);res(best)};
  const tm=setTimeout(fin,12000);
  id=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.acc)best={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};if(best.acc<=30)fin()},()=>fin(),{enableHighAccuracy:true,timeout:12000,maximumAge:0})})}
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
async function doScan(tok){
  const args={p_token:tok};
  if(String(tok).split('|')[2]==='S'){toast('लोकेशन जाँची जा रही है…');const p=await getPos();if(p){args.p_lat=p.lat;args.p_lng=p.lng;args.p_acc=p.acc}}
  const r=must(await sb.rpc('scan_gate',args));
  ui.lastScan={r:r,ts:Date.now()};
  await loadAll();render();window.scrollTo(0,0);
}
function tokenFrom(t){
  t=String(t||'');if(t.indexOf('SP360|')===0)return t;
  try{return new URL(t).searchParams.get('t')||''}catch(e){return ''}
}
let cam=null;
function camStop(){if(!cam)return;clearInterval(cam.timer);try{cam.st.getTracks().forEach(x=>x.stop())}catch(e){}if(cam.ov.parentNode)cam.ov.parentNode.removeChild(cam.ov);cam=null}
async function camScan(){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('इस फ़ोन में QR स्कैनर नहीं है। फ़ोन के कैमरा ऐप से स्कैन करें।');return}
  try{
    const det=new BarcodeDetector({formats:['qr_code']});
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const ov=document.createElement('div');ov.className='camov';
    ov.innerHTML='<video playsinline muted></video><button class="btn gold" type="button" data-act="camclose">कैमरा बंद करें</button>';
    document.body.appendChild(ov);const v=ov.querySelector('video');v.srcObject=st;await v.play();loc(ov);
    let busy=false;
    cam={st:st,ov:ov,timer:setInterval(async()=>{
      if(busy)return;busy=true;
      try{const r=await det.detect(v);if(r[0]){const tok=tokenFrom(r[0].rawValue);if(tok){camStop();await doScan(tok).catch(e=>toast(errH(e.message)))}}}catch(e){}
      busy=false},350)};
  }catch(e){camStop();toast('कैमरा नहीं खुल सका।')}
}

  if(r.result==='nolocation')return mk('लोकेशन चालू करें','छपे QR से एंट्री के लिए फ़ोन की लोकेशन की अनुमति (Allow) देनी ज़रूरी है। लोकेशन चालू करके QR फिर स्कैन करें।');

  if(r.result==='stopped')return mk('इस जिम की सेवा बंद हो चुकी है','अपने जिम ओनर से बात करें।');
  if(r.result==='nosetup')return mk('जिम की लोकेशन सेट नहीं है','ओनर से कहें कि ऐप में जिम की लोकेशन सेट करें।');

  const left=r.days_left==null?0:Number(r.days_left),due=Number(r.due)||0,st=r.fee_status;
  let cls=st==='expired'?'bad':st==='warning'?'warn':'ok',mark='✓',head,sub;

  else if(st==='expired'){mark='!';head='अनपेड: '+esc(r.name);sub='आपकी फ़ीस '+(1-left)+' दिन पहले खत्म हो चुकी है। कृपया काउंटर पर फ़ीस जमा करें।'}
  else{head='एंट्री दर्ज: '+esc(r.name);sub=st==='warning'?(left<=5?'फ़ीस सिर्फ़ '+left+' दिन बची है।':inr(due)+' फ़ीस बाकी है।'):'फ़ीस चालू है।'}
  const last=r.expires_on?addD(pd(r.expires_on),-1):null;
  return '<section class="scan '+cls+'" role="status"><div class="scan-h"><span class="mark">'+mark+'</span><div><b>'+head+'</b><p>'+sub+'</p></div></div>'
   +'<dl class="kv"><div><dt>नाम</dt><dd>'+esc(r.name)+'</dd></div><div><dt>स्कैन का समय</dt><dd class="num">'+ft(s.ts)+'</dd></div>'

   +'<div><dt>कुल / पेड / बाकी</dt><dd class="num">'+inr(r.total_fee||0)+' / '+inr(r.paid||0)+' / '+inr(due)+'</dd></div>'
   +'<div><dt>वैधता तक</dt><dd>'+(last?fd(last)+' ('+(left>0?left+' दिन बचे':'खत्म')+')':'–')+'</dd></div></dl></section>';
}

const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function visitsOf(id){
  const ls=S.logs.filter(l=>l.m===id).sort((a,b)=>a.ts-b.ts),map={};let open=null;
  ls.forEach(l=>{if(l.t==='in'){open={in:l.ts,out:null};const k=iso(sod(l.ts));(map[k]=map[k]||[]).push(open)}else if(open&&!open.out){open.out=l.ts}});
  return map;
}

function sumOf(list){
  const by={};let sets=0,vol=0,min=0;
  list.forEach(w=>{sets+=w.sets||0;vol+=(w.sets||0)*(w.reps||0)*Number(w.kg||0);min+=w.min||0;by[w.name]=(by[w.name]||0)+1});
  return{days:new Set(list.map(w=>w.d)).size,n:list.length,sets:sets,vol:Math.round(vol),min:min,top:Object.keys(by).sort((a,b)=>by[b]-by[a]).slice(0,3)};
}

function mlevels(W){

  W.forEach(w=>{const m=EXM[w.name];if(m&&m!=='cardio'&&w.d>=cut)pt[m]=(pt[m]||0)+(w.sets||1)});
  const lv={};Object.keys(pt).forEach(m=>{const p=pt[m];lv[m]=p>=30?5:p>=20?4:p>=12?3:p>=6?2:1});return lv;
}

async function reloadFit(){

  const gg=S.fit&&S.fit.goal,ws=S.fit&&S.fit.weights||[];
  if(gg&&gg.target_weight!=null&&gg.goal_start_kg!=null&&ws.length){
    const cw=Number(ws[ws.length-1].kg),st=Number(gg.goal_start_kg),tg=Number(gg.target_weight);
    if(st!==tg&&((tg<st&&cw<=tg)||(tg>st&&cw>=tg))){try{const a=must(await sb.rpc('claim_goal'));if(a){ui.award=a;S.fit=must(await sb.rpc('my_fitness'))}}catch(e){}}}
}

const csvCell=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csvText=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
const istStr=ts=>ts?new Date(ts).toLocaleString('en-GB',{timeZone:'Asia/Kolkata',hour12:false}).replace(',',''):'';
async function pagedAll(q){const all=[];for(let p=0;p<60;p++){const d=must(await q().range(p*1000,p*1000+999))||[];all.push.apply(all,d);if(d.length<1000)break}return all}
async function buildCsv(kind){
  const nm={},ph={};S.members.forEach(m=>{nm[m.id]=m.name;ph[m.id]=m.phone});
  if(kind==='members'){
    const tn={};S.trainers.forEach(t=>{tn[t.id]=t.name});
    return [['Name','Phone','Plan (months)','Total fee','Paid','Due','Start date','Valid until','Last paid on','Trainer']].concat(S.members.map(m=>{const f=feeInfo(m);return [m.name,m.phone,m.months,m.total,m.paid,Math.max(0,m.total-m.paid),m.start,iso(f.last),m.lastPaid,tn[m.trainer]||'']}));
  }
  if(kind==='payments'){
    const rows=await pagedAll(()=>sb.from('payments').select('member_id,amount,paid_on').order('paid_on',{ascending:true}));
    return [['Name','Phone','Amount','Paid on']].concat(rows.map(r=>[nm[r.member_id]||'',ph[r.member_id]||'',r.amount,r.paid_on]));
  }
  const rows=await pagedAll(()=>sb.from('attendance').select('member_id,checked_in_at,checked_out_at').order('checked_in_at',{ascending:true}));
  return [['Name','Phone','In (IST)','Out (IST)','Minutes']].concat(rows.map(r=>{const a=Date.parse(r.checked_in_at),o=r.checked_out_at?Date.parse(r.checked_out_at):null;return [nm[r.member_id]||'',ph[r.member_id]||'',istStr(a),istStr(o),o?Math.round((o-a)/60000):'']}));
}
async function exportCsv(kinds,share){
  const g=gOwn(),day=iso(T0()),files=[];
  for(const k of kinds){const f=new File([csvText(await buildCsv(k))],g.code+'-'+k+'-'+day+'.csv',{type:'text/csv'});files.push(f)}
  if(share&&navigator.canShare&&navigator.canShare({files:files})){await navigator.share({files:files,title:g.name});}
  else files.forEach((f,i)=>{setTimeout(()=>{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)},i*600)});
  lsSet('sp360-backup-'+g.code,day);ui.lastBackup=day;render();toast(share?'फ़ाइल तैयार है':'फ़ाइल डाउनलोड हो रही है');
}

    const r=must(await sb.rpc('request_gym',{p_name:v.name,p_address:v.address,p_owner:v.owner,p_phone:v.phone}));
    if(r.result==='ok'){ui.reqDone=v;render();window.scrollTo(0,document.body.scrollHeight)}
    else toast(r.result==='duplicate'?'इस नंबर का अनुरोध पहले से भेजा हुआ है':r.result==='busy'?'अभी बहुत अनुरोध हैं, कुछ देर बाद कोशिश करें':'जानकारी सही भरें')},
  pubcrowd:async f=>{const code=String(new FormData(f).get('code')).trim();lsSet('sp360-gym',code);const r=await sb.rpc('public_crowd',{p_code:code});if(r.error)throw r.error;ui.pub=r.data;render()},
  'login-owner':f=>{const d=new FormData(f);return doLogin(emailOf.owner(d.get('code')),String(d.get('pass')),'जिम ID या पासवर्ड गलत है।',{code:d.get('code')})},
  'login-member':f=>{const d=new FormData(f),code=String(d.get('code')).trim();lsSet('sp360-gym',code);return doLogin(emailOf.member(d.get('phone'),code),String(d.get('pin')),'मोबाइल नंबर या पिन गलत है।',{code:code,phone:d.get('phone')})},
  'login-admin':f=>{const d=new FormData(f);return doLogin(String(d.get('email')).trim(),String(d.get('pass')),'ईमेल या पासवर्ड गलत है।',{email:d.get('email')})},
  addm:async f=>{const d=new FormData(f),mo=Number(d.get('mo')),name=String(d.get('name')).trim(),phone=String(d.get('phone'));
    const r=await fn({action:'create_member',name:name,phone:phone,months:mo,total_fee:num(d.get('total')),paid:num(d.get('paid'))});
    ui.newPin={name:name,phone:phone,pin:r.pin};ui.sel=r.member_id;await refresh();const e=$('#pinbox');if(e)e.scrollIntoView();toast(name+' जुड़ गए')},
  pay:async f=>{const m=S.members.find(x=>x.id===f.dataset.id),amt=num(new FormData(f).get('amt')),due=Math.max(0,m.total-m.paid);
    if(amt>0&&m.msId){must(await sb.from('payments').insert({gym_id:m.gym,member_id:m.id,membership_id:m.msId,amount:Math.min(amt,due||amt),paid_on:iso(T0())}));await refresh();toast(inr(Math.min(amt,due||amt))+' जमा हुए')}},
  renew:async f=>{const m=S.members.find(x=>x.id===f.dataset.id),d=new FormData(f),mo=Number(d.get('mo')),tot=num(d.get('total')),paid=Math.min(tot,num(d.get('paid')));
    const ms=must(await sb.from('memberships').insert({gym_id:m.gym,member_id:m.id,months:mo,total_fee:tot,start_date:iso(T0())}).select().single());
    if(paid>0)must(await sb.from('payments').insert({gym_id:m.gym,member_id:m.id,membership_id:ms.id,amount:paid,paid_on:iso(T0())}));
    const t=new Date();ui.cal={y:t.getFullYear(),m:t.getMonth()};await refresh();toast('फ़ीस आज से रिन्यू हो गई')},
  editm:async f=>{const m=S.members.find(x=>x.id===f.dataset.id),d=new FormData(f),name=String(d.get('name')).trim(),phone=String(d.get('phone')).trim();
    await fn({action:'update_member',member_id:m.id,name:name,phone:phone});await refresh();toast(phone!==m.phone?'बदल गया। अब नए नंबर से लॉगिन होगा, पिन वही रहेगा':'बदल गया')},
  setfee:async f=>{const m=S.members.find(x=>x.id===f.dataset.id),tot=num(new FormData(f).get('total'));
    if(!m.msId)throw new Error('प्लान नहीं मिला');
    if(tot<m.paid){toast('कुल फ़ीस जमा हो चुकी रकम से कम नहीं हो सकती');return}
    must(await sb.from('memberships').update({total_fee:tot}).eq('id',m.msId).select());await refresh();toast('फ़ीस बदल गई')},
  plans:async f=>{const d=new FormData(f),o={};['1','3','6','12'].forEach(k=>{o[k]=num(d.get('p'+k))});
    must(await sb.rpc('set_plan_fees',{p_fees:o}));await refresh();toast('रेट सेव हो गए')},
  gymedit:async f=>{const d=new FormData(f),g=gOwn();must(await sb.rpc('update_my_gym',{p_name:String(d.get('name')).trim(),p_address:String(d.get('address')).trim(),p_capacity:Math.max(5,Math.min(500,Math.round(Number(d.get('cap'))||25))),p_has_trainers:g.hasTrainers}));const on=String(d.get('owner')).trim(),op=String(d.get('ophone')).trim();if(on!==g.owner||op!==g.phone)await fn({action:'update_gym_owner',owner_name:on,owner_phone:op});await refresh();toast('सेव हो गया')},
  addt:async f=>{const d=new FormData(f);must(await sb.from('trainers').insert({gym_id:S.sess,name:String(d.get('name')).trim(),phone:String(d.get('phone')),speciality:String(d.get('spec')).trim()}));await refresh();toast('ट्रेनर जुड़ गया')},
  diet:async f=>{const d=new FormData(f),m=S.members.find(x=>x.id===f.dataset.id),w=Number(d.get('w')),h=Number(d.get('h')),goal=d.get('goal'),s=dietSuggest(w,h,goal);
    must(await sb.from('diet_inquiries').insert({gym_id:m.gym,member_id:m.id,weight_kg:w,height_cm:Math.round(h),goal:goal,food_pref:d.get('pref'),consent:true}));
    ui.dietMsg='आपका BMI '+s.bmi+' ('+s.cat+') है। सुझाया गया: <b>'+s.type+'</b>। आपकी इंक्वायरी ShinePro360 को भेज दी गई है, हम जल्दी संपर्क करेंगे।';await refresh()},
  addgym:async f=>{const d=new FormData(f),name=String(d.get('name')).trim(),owner=String(d.get('owner')).trim(),phone=String(d.get('phone'));
    const r=await fn({action:'create_gym',name:name,owner_name:owner,owner_phone:phone,address:String(d.get('address')).trim(),capacity:Number(d.get('cap'))||25});
    ui.newGym={name:name,code:r.code,pass:r.password,owner:owner,phone:phone};await refresh();toast('जिम जुड़ गया')}
};
const run=(p,btn)=>Promise.resolve(p).catch(e=>toast(errH(e&&e.message))).then(()=>{if(btn&&btn.isConnected)btn.disabled=false});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=ACT[b.dataset.act];if(a)run(a(b))});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])run(CHG[t.dataset.chg](t))});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;run(FORMS[f.dataset.form](f),btn)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.inp==='q'){ui.q=t.value;const w=$('#mtable');if(w){w.innerHTML=mTable();loc(w)}}
  if(t.dataset.inp==='total'){const f=t.closest('form');if(f&&f.elements.paid)f.elements.paid.value=t.value}
  if(t.dataset.inp==='fee'){ui.fee=t.value;const fee=Number(t.value)||0,e1=$('#feeTot');if(e1)e1.textContent=inr(S.gyms.filter(g=>g.sub==='paid').length*fee)}});

/* ---------- sign-in, routing, render ---------- */
const HOME={admin:'admin',owner:'owner',member:'member',vendor:'vendor'};
const ALLOWED={admin:['admin'],owner:['owner','gate'],member:['member'],vendor:['vendor']};
const NAVS={admin:[['admin','ShinePro360 एडमिन']],owner:[['owner','जिम ओनर'],['gate','गेट QR स्क्रीन']],member:[['member','मेंबर ऐप']],vendor:[['vendor','वेंडर पैनल']]};
function routeNow(){
  if(!S.role)return 'login';
  const r=(location.hash||'').slice(1),ok=ALLOWED[S.role]||[];
  return ok.indexOf(r)>=0?r:HOME[S.role];
}
const ROUTES={login:vLogin,owner:()=>cancelBanner()+((S.resets||[]).length?'<p class="scan warn" style="margin-bottom:16px" role="status"><b>कुछ मेंबर ने पिन भूलने का अनुरोध भेजा है।</b> <span class="num">'+S.resets.length+'</span><br><span class="sm">मेंबर और फ़ीस में जाकर नया पिन बनाएँ।</span></p>':'')+vOwner(),gate:vGate,member:vMember,admin:vAdmin,vendor:vVendor};
async function enter(){
  const sess=(await sb.auth.getSession()).data.session;
  if(!sess){ui.loading=false;S=BLANK();render();return}
  const au=await sb.from('app_users').select('role,gym_id,member_id,vendor_id').eq('user_id',sess.user.id).maybeSingle();
  if(au.error||!au.data){try{await sb.auth.signOut()}catch(e){}S=BLANK();ui.loading=false;ui.err='आपके खाते को कोई भूमिका नहीं मिली। ShinePro360 से संपर्क करें।';render();return}
  S=BLANK();S.role=au.data.role;S.sess=au.data.gym_id||'';S.me=au.data.member_id||'';
  try{await loadAll()}catch(e){S=BLANK();ui.loading=false;ui.err=errH(e&&e.message);render();return}
  ui.loading=false;ui.sub='today';
  if(location.hash!=='#'+HOME[S.role])history.replaceState(null,'',location.pathname+'#'+HOME[S.role]);
  render();
  if(pending){const t=pending;pending='';if(S.role==='member')await doScan(t).catch(e=>toast(errH(e&&e.message)))}
}
function render(){
  const r=routeNow(),app=$('#app');
  const nav=$('#nav'),lo=$('#lo');
  nav.innerHTML=(NAVS[S.role]||[]).map(n=>'<a href="#'+n[0]+'" aria-current="'+(n[0]===r?'page':'false')+'">'+n[1]+'</a>').join('');
  lo.hidden=!S.role;
  loc($('.top'));
  if(ui.fatal){app.innerHTML='<section class="panel"><p class="err">'+esc(ui.fatal)+'</p></section>';loc(app);return}
  if(ui.loading){app.innerHTML='<p class="muted">लोड हो रहा है…</p>';loc(app);return}
  app.innerHTML=ROUTES[r]()+'<p class="muted sm pver" style="margin-top:32px">Powered by ShinePro360 · Gym Support &amp; Service · '+VER+'</p>';loc(app);
  if(r==='gate')drawQR();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
setInterval(gateTick,500);
setInterval(async()=>{
  if(!S.role||document.hidden||cam)return;
  const a=document.activeElement,r=routeNow();
  if(r!=='gate'&&a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
  ui.pollN=(ui.pollN||0)+1;
  try{await loadAll(ui.pollN%20!==0)}catch(e){return}
  const sel=window.getSelection&&String(window.getSelection()||'');
  if(sel||ui.newPin||ui.newGym||ui.newVen||ui.cpDirty||ui.vDirty)return;
  if(r==='gate'){const c=$('#gcount');if(c)c.textContent=insideOf(S.sess).length}else render();
},15000);
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname,{cache:'no-store'}),t=await r.text(),mm=t.match(/VER='(v\d+)'/);
    if(mm&&mm[1]!==VER&&!$('.upd')){const d=document.createElement('div');d.className='upd';d.setAttribute('role','status');
      d.innerHTML='<span>नया वर्शन आ गया है।</span><button class="btn gold sm" type="button" id="updgo">अपडेट करें</button>';
      document.body.appendChild(d);$('#updgo').onclick=()=>{location.replace(location.pathname+'?u='+Date.now())}}
  }catch(e){}
}
async function init(){
  locStatic();
  const qs=new URLSearchParams(location.search),t=qs.get('t'),g=qs.get('g');
  if(g){lsSet('sp360-gym',g);ui.lmode='member'}
  if(t){pending=t;ui.lmode='member'}
  if(t||g||location.search)history.replaceState(null,'',location.pathname+location.hash);
  if(!sb){ui.fatal='ऐप लोड नहीं हो सकी। इंटरनेट जाँचकर पेज फिर खोलें।';render();return}
  render();
  try{await enter()}catch(e){ui.loading=false;ui.err=errH(e&&e.message);render()}
}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,600000);

init();
})();
</script>
